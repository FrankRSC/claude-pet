name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/claude-pet \
            target/aarch64-apple-darwin/release/claude-pet \
            target/x86_64-apple-darwin/release/claude-pet

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          mkdir dist
          copy target\release\claude-pet.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: claude-pet-${{ runner.os }}
          path: dist/

  # Si la versión de Cargo.toml en main todavía no tiene release, se publica
  # (y se crea el tag vX.Y.Z); el botón "Buscar actualización" de la app
  # descarga de ahí claude-pet-macos o claude-pet-windows.exe.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: ¿Versión nueva?
        id: version
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag ya está publicado; para sacar otro release sube la versión en Cargo.toml."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
      - name: Publicar
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mv claude-pet-macOS/claude-pet claude-pet-macos
          mv claude-pet-Windows/claude-pet.exe claude-pet-windows.exe
          gh release create "$TAG" claude-pet-macos claude-pet-windows.exe --target "$GITHUB_SHA" --generate-notes
